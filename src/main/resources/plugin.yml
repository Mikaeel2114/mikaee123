name: BedFight
main: com.example.bedfight.BedFightPlugin
version: 1.1.0
author: YourName
description: BedFight minigame with minestormparty integration
# minestormparty is optional: without it, queues work and teams are split locally.
softdepend: [minestormparty]

commands:
  bedfight:
    description: BedFight queue, private matches, spectating and arena setup
    usage: /<command> [1v1|2v2|3v3|private|spec <player>|leave]
    aliases: [bf]

  leave:
    description: Leave the BedFight queue, match or spectator mode
    usage: /<command>
    aliases: [l]

  adminkiteditor:
    description: Edit the kit given to players in a match
    usage: /<command> [reset]
    permission: bedfight.admin

permissions:
  bedfight.play:
    description: Join the BedFight queue
    default: true
  bedfight.spectate:
    description: Spectate running matches with /bedfight spec <player>
    default: true
  bedfight.admin:
    description: Arena setup commands
    default: op
  bedfight.rank.mvpplusplus:
    description: MVP++ rank, allowed to create private matches
    default: false
